name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      publish_packages: ${{ steps.packages.outputs.publish }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="flinch_${version}_${os}_${arch}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/angelnicolasc/flinch/internal/cli.Version=${version}" \
              -o "dist/$name/flinch$ext" ./cmd/flinch
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)

      - name: Prepare stable package-manager manifests
        id: packages
        env:
          TAG: ${{ github.ref_name }}
          HAS_PACKAGE_TOKEN: ${{ secrets.PACKAGE_MANAGER_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            go run ./scripts/releasemanifests "$TAG" dist/checksums.txt "$RUNNER_TEMP/package-manifests"
            ruby -c "$RUNNER_TEMP/package-manifests/Formula/flinch.rb"
            jq empty "$RUNNER_TEMP/package-manifests/flinch.json"
            echo "publish=$HAS_PACKAGE_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          section() { awk -v h="## [$1]" 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md; }
          section "$version" > notes.md
          if [ ! -s notes.md ] && [ "$version" != "${version%%-*}" ]; then
            section Unreleased > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          # The attestation step runs only for a public repository, so only then do the notes mention it.
          printf '\n### Verify the download\n\nCompare each archive with `checksums.txt` (SHA-256).' >> notes.md
          if [ "$PRIVATE_REPO" != true ]; then
            printf ' To confirm where an archive was built, run `gh attestation verify <archive> --repo %s`.' "$GITHUB_REPOSITORY" >> notes.md
          fi
          printf '\n\nThe macOS binaries are not notarized. After extracting, run `xattr -d com.apple.quarantine flinch` once before the first run.\n' >> notes.md

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          manifests=()
          if [[ -d "$RUNNER_TEMP/package-manifests" ]]; then
            manifests+=("$RUNNER_TEMP/package-manifests/Formula/flinch.rb" "$RUNNER_TEMP/package-manifests/flinch.json")
          fi
          gh release create "$TAG" dist/* "${manifests[@]}" --title "$TAG" --notes-file notes.md --verify-tag "${flags[@]}"

  publish_packages:
    needs: release
    if: ${{ needs.release.outputs.publish_packages == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the released manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern flinch.rb --pattern flinch.json

      - name: Publish Homebrew and Scoop updates
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish() {
            local repo=$1 path=$2 file=$3 branch tree sha prior current
            branch=$(gh api "repos/$repo" --jq .default_branch)
            tree=$(gh api "repos/$repo/git/trees/$branch?recursive=1")
            sha=$(jq -er --arg path "$path" 'if .truncated then error("incomplete repository tree") else [.tree[] | select(.path == $path) | .sha][0] // "" end' <<< "$tree")
            if [[ -n "$sha" ]]; then
              if [[ "$sha" == "$(git hash-object --no-filters "$file")" ]]; then return; fi
              prior=$(gh api "repos/$repo/git/blobs/$sha" --jq .content | base64 --decode)
              if [[ "$file" == *.json ]]; then
                current=$(jq -er .version <<< "$prior")
              else
                current=$(sed -nE 's/^  version "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' <<< "$prior")
              fi
              if [[ -z "$current" ]]; then echo "::error::Could not read $repo/$path version"; return 1; fi
              if [[ "$(printf '%s\n' "$current" "${TAG#v}" | sort -V | tail -1)" != "${TAG#v}" ]]; then
                echo "$repo/$path is already newer than $TAG"
                return
              fi
            fi
            jq -n --arg branch "$branch" --arg sha "$sha" --arg tag "$TAG" --rawfile contents "$file" \
              '{branch:$branch, message:("Publish Flinch " + $tag), content:($contents | @base64)} + (if $sha == "" then {} else {sha:$sha} end)' |
              gh api --method PUT "repos/$repo/contents/$path" --input - > /dev/null
          }
          publish angelnicolasc/homebrew-tap Formula/flinch.rb flinch.rb
          publish angelnicolasc/scoop-bucket flinch.json flinch.json
