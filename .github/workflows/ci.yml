name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o flinch ./cmd/flinch

      - name: Run tests (Linux with race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
