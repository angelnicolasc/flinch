name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pytest and Ruff
        if: runner.os == 'Linux'
        run: python -m pip install pytest==8.4.2 ruff==0.15.11

      - name: Test release manifests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p test_release_manifests.py

      - name: Set up Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'

      - name: Install Vitest and Jest
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/flinch-js" --no-audit --no-fund vitest@3.2.4 jest@29.7.0
          echo "FLINCH_REAL_VITEST=$RUNNER_TEMP/flinch-js/node_modules/.bin/vitest" >> "$GITHUB_ENV"
          echo "FLINCH_REAL_JEST=$RUNNER_TEMP/flinch-js/node_modules/.bin/jest" >> "$GITHUB_ENV"

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o flinch ./cmd/flinch

      - name: Run tests (Linux with race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
