name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal scripts)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      # Every integration Flinch supports runs for real on both systems. The
      # versions are pinned here; the weekly workflow tries the latest ones.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pytest and Ruff
        run: python -m pip install pytest==8.4.2 ruff==0.15.11

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'

      - name: Install Vitest, Jest, ESLint and ast-grep
        run: |
          npm install --prefix "$RUNNER_TEMP/flinch-js" --no-audit --no-fund \
            vitest@3.2.4 jest@29.7.0 eslint@10.15.0 @ast-grep/cli@0.51.3
          bin="$RUNNER_TEMP/flinch-js/node_modules/.bin"
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".cmd"; fi
          {
            echo "FLINCH_REAL_VITEST=$bin/vitest$ext"
            echo "FLINCH_REAL_JEST=$bin/jest$ext"
            echo "FLINCH_REAL_ESLINT=$bin/eslint$ext"
            echo "FLINCH_REAL_AST_GREP=$bin/ast-grep$ext"
          } >> "$GITHUB_ENV"

      # go install verifies the module against the Go checksum database.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          echo "FLINCH_REAL_GOLANGCI_LINT=$(go env GOPATH)/bin/golangci-lint$ext" >> "$GITHUB_ENV"

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o flinch ./cmd/flinch

      # FLINCH_REQUIRE_TOOLS turns a missing integration tool into a failure,
      # and requiredtests fails the job if a listed integration test is
      # missing, skipped or failing. go test's own exit status is kept.
      - name: Run tests
        env:
          FLINCH_REQUIRE_TOOLS: '1'
        run: |
          race=""
          if [ "$RUNNER_OS" = Linux ]; then race="-race"; fi
          set +e
          go test $race -json -count=1 ./... > "$RUNNER_TEMP/go-test.json"
          tests=$?
          go run ./scripts/requiredtests -list .github/required-tests.txt -os "$RUNNER_OS" < "$RUNNER_TEMP/go-test.json"
          required=$?
          if [ "$tests" -ne 0 ] || [ "$required" -ne 0 ]; then exit 1; fi
